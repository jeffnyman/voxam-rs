<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voxam</title>
<link rel="stylesheet" href="glkote.css" type="text/css">
<style type="text/css">
/* The Display menu's knobs, worn as variables the dresser sets:
   the story's type and size, and the measure of its column. */
:root {
  --story-face: Palatino, Georgia, "Times New Roman", Times, serif;
  --story-size: 15px;
  --grid-size: 14px;
  --measure: 900px;
  --pane: 340px;
}
html, body {
  margin: 0;
  height: 100%;
}
#gameport {
  position: absolute;
  overflow: hidden;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: var(--measure);
  top: 0;
  bottom: 0;
}
/* With a pane open the story keeps its measure but centres in
   what is left, so opening the map slides the column over rather
   than reflowing the prose under the player's eye. GlkOte
   re-measures on the resize the toggle fires. */
body.paned #gameport {
  left: 0;
  right: var(--pane);
  width: auto;
  transform: none;
  margin-left: auto;
  margin-right: auto;
}
.BufferWindow, .BufferWindow .Input {
  font-family: var(--story-face);
  font-size: var(--story-size);
}
.GridWindow, .GridWindow .Input {
  font-size: var(--grid-size);
}
.Input {
  color: inherit;
  background: transparent;
}
/* The inks, each a whole dress: page, story, and the grid with
   its inverse -- the Z-Machine's reverse video (§8.7) travels as
   user1, wearing the classic bar in every ink. */
body.theme-paper {
  background: #444;
}
body.theme-paper #gameport {
  background: white;
  color: black;
}
body.theme-paper .Style_user1 {
  background: #333;
  color: #fff;
}
body.theme-paper .GridWindow {
  background: #333;
  color: #fff;
}
body.theme-paper .GridWindow .Style_user1 {
  background: #fff;
  color: #333;
}
body.theme-sepia {
  background: #2f2921;
}
body.theme-sepia #gameport {
  background: #f4ecd8;
  color: #43382a;
}
body.theme-sepia .Style_user1 {
  background: #43382a;
  color: #f4ecd8;
}
body.theme-sepia .GridWindow {
  background: #43382a;
  color: #f4ecd8;
}
body.theme-sepia .GridWindow .Style_user1 {
  background: #f4ecd8;
  color: #43382a;
}
body.theme-dark {
  background: #111;
}
body.theme-dark #gameport {
  background: #1c1c1c;
  color: #d6d6d6;
}
body.theme-dark .Style_user1 {
  background: #d6d6d6;
  color: #1c1c1c;
}
body.theme-dark .GridWindow {
  background: #000;
  color: #d6d6d6;
}
body.theme-dark .GridWindow .Style_user1 {
  background: #d6d6d6;
  color: #000;
}
/* The map pane: a column at the right edge, shown only when the
   View menu says so. Its ink follows the story's, since the two
   are read together. */
#panes {
  position: absolute;
  top: 0;
  bottom: 0;
  right: 0;
  width: var(--pane);
  z-index: 8;
  display: none;
  flex-direction: column;
  font-family: "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 12px;
}
body.paned #panes {
  display: flex;
}
/* Two panes share the column, each taking half; one alone takes
   all of it. min-height:0 is what lets a flex child scroll
   instead of pushing its neighbour off the bottom. */
#mappane, #notepane {
  display: none;
  flex-direction: column;
  min-height: 0;
}
body.pane-map #mappane {
  display: flex;
  flex: 1;
}
body.pane-notes #notepane {
  display: flex;
  flex: 1;
}
body.pane-map.pane-notes #notepane {
  border-top: 1px solid;
  border-color: inherit;
}
#panes h2 {
  margin: 0;
  padding: 0.6em 0.9em;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.65;
}
#mapdraw {
  flex: 1;
  overflow: auto;
  padding: 0 0.6em 0.9em;
}
.mapnote {
  margin: 0.4em 0.3em;
  opacity: 0.7;
  line-height: 1.5;
}
/* The notepad: plain text, kept per story, saved as it is
   written. The heading carries the one button worth having --
   stamping in the room the player stands in, which is the note a
   player is usually about to write anyway. */
#notepane h2 {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.6em;
}
#stamp {
  font: inherit;
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: none;
  padding: 0.15em 0.6em;
  cursor: pointer;
  background: transparent;
  color: inherit;
  border: 1px solid;
  border-radius: 3px;
  opacity: 0.75;
}
#stamp:hover {
  opacity: 1;
}
#notes {
  flex: 1;
  min-height: 0;
  margin: 0 0.6em 0.9em;
  padding: 0.5em 0.6em;
  resize: none;
  font-family: "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 12.5px;
  line-height: 1.55;
  background: transparent;
  color: inherit;
  border: 1px solid;
  border-color: inherit;
  border-radius: 3px;
}
#notes:focus {
  outline: none;
  opacity: 1;
}
.maproom {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.1;
  opacity: 0.75;
}
.maproom.here {
  stroke-width: 2;
  opacity: 1;
}
.mapname {
  fill: currentColor;
  font-size: 9px;
  text-anchor: middle;
  opacity: 0.8;
}
.mapname.here {
  opacity: 1;
  font-weight: 700;
}
.mappassage {
  stroke: currentColor;
  stroke-width: 1.1;
  opacity: 0.55;
  fill: none;
}
/* A passage whose far room was placed elsewhere: bowed by the
   drawing, and faded here, so it never reads as a corridor ruled
   through the rooms it passes over. */
.mappassage.stretched {
  opacity: 0.28;
}
/* A passage with no bearing on the plane is dashed; one the map
   could not name at all is dotted. */
.mappassage.kind-up,
.mappassage.kind-down,
.mappassage.kind-in,
.mappassage.kind-out {
  stroke-dasharray: 4 3;
}
.mappassage.kind-other {
  stroke-dasharray: 1 3;
  opacity: 0.4;
}
.maplabel {
  fill: currentColor;
  font-size: 8px;
  text-anchor: middle;
  opacity: 0.7;
}
.maparrow {
  fill: currentColor;
  opacity: 0.55;
}
body.theme-paper #panes {
  background: #f2f2f2;
  color: #222;
  border-left: 1px solid #d5d5d5;
  border-color: #d5d5d5;
}
body.theme-sepia #panes {
  background: #ece2cb;
  color: #43382a;
  border-left: 1px solid #d8cbb0;
  border-color: #d8cbb0;
}
body.theme-dark #panes {
  background: #171717;
  color: #cfcfcf;
  border-left: 1px solid #2c2c2c;
  border-color: #2c2c2c;
}
/* The landing overlay covers the gameport but never hides it:
   GlkOte must measure real geometry the moment it initializes. */
#landing {
  position: absolute;
  inset: 0;
  z-index: 10;
  background: #444;
  color: #ddd;
  font-family: Georgia, serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.75em;
  text-align: center;
}
#landing h1 {
  font-size: 3em;
  letter-spacing: 0.15em;
  color: #0bf;
  margin: 0;
}
#landing p {
  margin: 0;
}
#landing button {
  font-size: 1.1em;
  padding: 0.5em 1.5em;
  margin-top: 1em;
  cursor: pointer;
}
#landing .note {
  max-width: 34em;
  margin-top: 1.5em;
  color: #f9a;
  white-space: pre-wrap;
  font-family: monospace;
  text-align: left;
}
#endedbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 9;
  display: none;
  background: #222;
  color: #eee;
  font-family: Georgia, serif;
  padding: 0.6em;
  text-align: center;
}
#endedbar button {
  margin-left: 1em;
  cursor: pointer;
}
</style>
<script src="jquery-1.12.4.min.js" type="text/javascript"></script>
<script src="glkote.js" type="text/javascript"></script>
<script src="voxam-audio.js" type="text/javascript"></script>
<script src="voxam-map.js" type="text/javascript"></script>
<script src="shell.js" type="text/javascript"></script>
</head>
<body class="theme-paper">
<div id="gameport">
<div id="windowport">
<noscript><p>You must have Javascript turned on to play.</p></noscript>
</div>
<div id="loadingpane">
<img src="waiting.gif" alt="LOADING"><br>
<em>Loading...</em>
</div>
<div id="errorpane" style="display:none;"><div id="errorcontent">...</div></div>
</div>
<div id="panes">
<div id="mappane">
<h2>Map</h2>
<div id="mapdraw"></div>
</div>
<div id="notepane">
<h2>Notes<button id="stamp" title="Write in the room you are standing in">where I am</button></h2>
<textarea id="notes" spellcheck="false" placeholder="Notes for this story, kept under its IFID."></textarea>
</div>
</div>
<div id="landing">
<h1>V&Theta;X&Delta;M</h1>
<p>An interpreter for Z-Machine and Glulx stories.</p>
<button id="open">Open a Story&hellip;</button>
<div class="note" id="note"></div>
</div>
<div id="endedbar">The story has ended.<button id="reopen">Open another&hellip;</button></div>
</body>
</html>
